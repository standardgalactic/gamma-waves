<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retro Planet Explorer – No Categories, Toggle Legend</title>
<style>
    body { margin: 0; overflow: hidden; background: black; font-family: monospace; }
    .project-label {
        position: absolute;
        color: #00ff00;
        font-size: 14px;
        pointer-events: none;
        background: rgba(0,0,0,0.8);
        padding: 2px 8px;
        border-radius: 4px;
        display: none;
        z-index: 10;
        max-width: 400px;
        white-space: pre-line;
        text-align: center;
        transition: opacity 0.2s;
    }
    #description-popup {
        position: absolute;
        left: 50%;
        top: 60px;
        transform: translateX(-50%);
        min-width: 300px;
        max-width: 600px;
        background: rgba(20,20,10,0.98);
        color: #ffd060;
        border: 2px solid #ffaa40;
        border-radius: 8px;
        padding: 16px 18px;
        font-size: 16px;
        font-family: monospace;
        z-index: 20;
        box-shadow: 0 4px 24px #000;
        display: none;
        white-space: pre-line;
        text-align: left;
    }
    #legend {
        position: absolute;
        left: 14px;
        top: 12px;
        background: rgba(0,0,0,0.85);
        color: #00ff00;
        border-radius: 7px;
        padding: 10px 16px;
        font-size: 14px;
        font-family: monospace;
        z-index: 30;
        max-width: 320px;
        line-height: 1.7;
        border: 1px solid #0a0;
        box-shadow: 0 2px 12px #000;
        letter-spacing: 0.02em;
        transition: opacity 0.2s;
    }
    .amber-highlight {
        pointer-events: none;
        position: absolute;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid #ffd060;
        box-shadow: 0 0 18px #ffd06080;
        background: none;
        z-index: 15;
        display: none;
    }
</style>

<body>
<div id="legend">
<b>Retro Planet Explorer</b><br>
W/A/S/D: Move<br>
Z: Toggle all labels<br>
X: Show/hide description<br>
H/J: Previous<br>
L/;: Next<br>
K: Random<br>
C: Toggle this panel<br>
<small>(Amber circle highlights selected. Try X!)</small>
</div>
<div id="description-popup"></div>

    {name:"99 Ways to Make a Paper Globe", desc:"Playful manual for paper worldmaking."},

    {name:"Recursive Cloakproof Chain Generator", desc:"Infinite symbolic protection generator."},
    {name:"ABRAXAS: Riddle Engine and Archive", desc:"Engine for riddles and mystical archives."},
    {name:"Codex Scroll Artifact Generator", desc:"Tool for creating codex-like scrolls."},
    {name:"Mythopoetic Trading Card System", desc:"Myth-based collectible system."},
    {name:"Paper Straw Ion Channel Analogy", desc:"Educational tool for bioelectricity."},
    {name:"Post-Theological Acrostic Converter", desc:"Generator for coded theological texts."}

// Color by index (not shown in labels, but keeps planets visually distinct)
function indexColor(idx) {
    // Pick from green range, but add some variance for visual distinction
    const base = 0x00ff00;
    const variance = ((idx * 47) % 0x80) << 8; // varies green channel
    return base - variance;
}

// ==== Scene Setup ====
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 12000);
camera.position.z = 3000;
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Starfield
const starGeometry = new THREE.BufferGeometry();
const starCount = 1000;
const starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
    starPositions[i*3] = Math.random() * 10000 - 5000;
    starPositions[i*3+1] = Math.random() * 10000 - 5000;
    starPositions[i*3+2] = Math.random() * -10000;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0x003300, size: 2 });
const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

// Planets & Labels
const planets = [];
const labels = [];
projectData.forEach((p, idx) => {
    const geo = new THREE.SphereGeometry(25,12,12);
    const mat = new THREE.MeshBasicMaterial({color:indexColor(idx)});
    const planet = new THREE.Mesh(geo, mat);
    planet.position.set(
        Math.random()*8000-4000,
        Math.random()*8000-4000,
        Math.random()*-8000
    );
    planet.userData = {...p, index: idx};
    scene.add(planet);
    planets.push(planet);

    // Overhead label
    const label = document.createElement('div');
    label.className = 'project-label';
    label.innerText = p.name;
    document.body.appendChild(label);
    labels.push(label);
});

// Amber Highlight Circle
const amberCircle = document.createElement('div');
amberCircle.className = 'amber-highlight';
document.body.appendChild(amberCircle);

// State
let labelsVisible = true; // Start ON
let legendVisible = true; // Start ON
let selectedIndex = 0;
let descriptionVisible = false;

// Controls
const keys = {};
document.addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()] = true;
    // Z: toggle labels
    if(e.key.toLowerCase() === 'z') {
        labelsVisible = !labelsVisible;
        labels.forEach(label => {
            label.style.display = labelsVisible ? 'block' : 'none';
        });
        amberCircle.style.display = labelsVisible ? 'block' : 'none';
    }
    // X: toggle description popup
    if(e.key.toLowerCase() === 'x') {
        descriptionVisible = !descriptionVisible;
        updateDescriptionPopup();
    }
    // H/J: previous
    if(e.key.toLowerCase() === 'h' || e.key.toLowerCase() === 'j') {
        selectedIndex = (selectedIndex - 1 + planets.length) % planets.length;
        updateDescriptionPopup();
    }
    // L/;: next
    if(e.key.toLowerCase() === 'l' || e.key === ';') {
        selectedIndex = (selectedIndex + 1) % planets.length;
        updateDescriptionPopup();
    }
    // K: random
    if(e.key.toLowerCase() === 'k') {
        selectedIndex = Math.floor(Math.random() * planets.length);
        updateDescriptionPopup();
    }
    // C: toggle legend panel
    if(e.key.toLowerCase() === 'c') {
        legendVisible = !legendVisible;
        document.getElementById('legend').style.opacity = legendVisible ? "1" : "0";
        document.getElementById('legend').style.pointerEvents = legendVisible ? "auto" : "none";
    }
});
document.addEventListener('keyup', e=>keys[e.key.toLowerCase()]=false);

// Description Popup
const descPopup = document.getElementById('description-popup');
function updateDescriptionPopup() {
    if (!descriptionVisible) {
        descPopup.style.display = "none";
    } else {
        const p = projectData[selectedIndex];
        descPopup.textContent = `${p.name}\n\n${p.desc}`;
        descPopup.style.display = "block";
    }
}

// Animate
function animate(){
    requestAnimationFrame(animate);

    // Camera controls
    if(keys['w']) camera.position.z -= 30;
    if(keys['s']) camera.position.z += 30;
    if(keys['a']) camera.position.x -= 30;
    if(keys['d']) camera.position.x += 30;
    camera.updateProjectionMatrix();

    // Position labels overhead
    if(labelsVisible) {
        planets.forEach((planet, i) => {
            // Overhead world position
            const worldPos = planet.position.clone();
            worldPos.y += 35;
            const screenPos = worldPos.project(camera);
            const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;
            labels[i].style.left = `${x - labels[i].offsetWidth/2}px`;
            labels[i].style.top = `${y - labels[i].offsetHeight}px`;
            // Hide if behind camera
            labels[i].style.opacity = (screenPos.z < 1 && screenPos.z > -1) ? '1' : '0';
            labels[i].style.display = 'block';
        });
        // Amber highlight for selected
        const planet = planets[selectedIndex];
        const worldPos = planet.position.clone();
        worldPos.y += 35;
        const screenPos = worldPos.project(camera);
        amberCircle.style.left = `${(screenPos.x * 0.5 + 0.5) * window.innerWidth - amberCircle.offsetWidth/2}px`;
        amberCircle.style.top = `${(-screenPos.y * 0.5 + 0.5) * window.innerHeight - amberCircle.offsetHeight - 12}px`;
        amberCircle.style.opacity = (screenPos.z < 1 && screenPos.z > -1) ? '1' : '0';
        amberCircle.style.display = 'block';
    } else {
        labels.forEach(label => label.style.display = 'none');
        amberCircle.style.display = 'none';
    }

    renderer.render(scene, camera);
}
animate();

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
