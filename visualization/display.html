<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Simulation Results</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables CSS -->
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            max-width: 1200px;
        }
        h1, h2 {
            color: #343a40;
        }
        .plot-img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        .video-container {
            margin-bottom: 20px;
        }
        video {
            max-width: 100%;
            height: auto;
        }
        .table-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">RSVP Simulation Results</h1>

        <!-- Metrics Plot -->
        <h2>Metrics Plot</h2>
        <img src="metrics_plot.png" alt="Metrics Plot" class="plot-img">

        <!-- Animations -->
        <h2>Grid Animations</h2>
        <div class="row">
            <div class="col-md-4 video-container">
                <h3>Entropy (S)</h3>
                <video controls>
                    <source src="entropy_animation.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="col-md-4 video-container">
                <h3>Capacity (Φ)</h3>
                <video controls>
                    <source src="capacity_animation.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div class="col-md-4 video-container">
                <h3>Activity (v)</h3>
                <video controls>
                    <source src="activity_animation.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </div>

        <!-- Data Table -->
        <h2>Simulation Data</h2>
        <div class="table-container">
            <table id="metricsTable" class="table table-striped table-bordered" style="width:100%">
                <thead>
                    <tr>
                        <th>Time (t)</th>
                        <th>Hamiltonian (H)</th>
                        <th>Total Entropy (S_total)</th>
                        <th>Average Capacity (Φ_avg)</th>
                        <th>Gini Coefficient</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <!-- Bootstrap JS and Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery (required for DataTables) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- DataTables JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script>
        // Load CSV data and populate table
        async function loadCSV() {
            try {
                const response = await fetch('simulation_metrics.csv');
                const text = await response.text();
                const rows = text.split('\n').slice(1); // Skip header
                const tbody = document.getElementById('tableBody');
                rows.forEach(row => {
                    if (row.trim()) { // Skip empty rows
                        const [t, H, S_total, Phi_avg, Gini] = row.split(',');
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${parseFloat(t).toFixed(0)}</td>
                            <td>${parseFloat(H).toFixed(2)}</td>
                            <td>${parseFloat(S_total).toFixed(2)}</td>
                            <td>${parseFloat(Phi_avg).toFixed(2)}</td>
                            <td>${parseFloat(Gini).toFixed(2)}</td>
                        `;
                        tbody.appendChild(tr);
                    }
                });

                // Initialize DataTables
                $('#metricsTable').DataTable({
                    pageLength: 10,
                    order: [[0, 'asc']] // Sort by time initially
                });
            } catch (error) {
                console.error('Error loading CSV:', error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5">Error loading data</td></tr>';
            }
        }

        // Run on page load
        window.onload = loadCSV;
    </script>
</body>
</html>
